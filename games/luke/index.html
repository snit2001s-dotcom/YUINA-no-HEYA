<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大乱闘スマブバ!! - クリスマス・プレゼント集め</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #e0f7fa; /* 爽やかな水色に変更 */
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
        }
        #score-board, #timer-board {
            background-color: rgba(0, 0, 0, 0.4); /* 少し薄くして背景を見やすく */
            padding: 5px 15px;
            border-radius: 5px;
        }
        
        /* スタート画面・ゲームオーバー画面のオーバーレイUI */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #overlay h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #fff;
        }
        #message {
            color: #d32f2f;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }
        .action-btn {
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            background-color: #ff9800; /* 可愛いオレンジ色 */
            color: white;
            border: 4px solid #e65100;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        #loading-text {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<a href="../../game.html" style="position: fixed; top: 12px; left: 12px; z-index: 100; font-family: sans-serif; font-weight: bold; font-size: 14px; color: #fff; background: rgba(0,0,0,0.45); padding: 8px 16px; border-radius: 999px; text-decoration: none;">← ゲームランドへもどる</a>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        <div id="score-board">スコア: <span id="score">0</span></div>
        <div id="timer-board">タイム: <span id="timer">60</span>s</div>
    </div>
    
    <div id="overlay">
        <h1 id="overlay-title">大乱闘スマブバ!!</h1>
        <div id="message"></div>
        <div id="loading-text">データを読み込み中...</div>
        <button id="start-btn" class="action-btn" style="display: none;">ゲームスタート！</button>
        <button id="reset-btn" class="action-btn" style="display: none;">もう一度遊ぶ</button>
    </div>
</div>

<script>
    window.addEventListener('load', function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const message = document.getElementById('message');
        const loadingText = document.getElementById('loading-text');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');

        // ---【BGMの読み込み】---
        const bgm = new Audio('bgm.mp3');
        bgm.loop = true; // ループ再生
        bgm.volume = 0.4; // 音量を少し控えめに設定 (0.0 ～ 1.0)

        // ---【アセットの読み込み】---
        const spritesToLoad = {
            bg: 'game_bg.jpg',
            luke: 'luke_sprite_detailed.png',
            lure: 'lure_sprite_detailed.png',
            apple: 'apple_sprite_detailed.png',
            present: 'present_sprite_detailed.png'
        };
        const loadedSprites = {};
        let totalSprites = Object.keys(spritesToLoad).length;
        let spritesLoadedCounter = 0;

        for (const [key, src] of Object.entries(spritesToLoad)) {
            const img = new Image();
            img.onload = () => {
                spritesLoadedCounter++;
                if (spritesLoadedCounter === totalSprites) {
                    allImagesLoaded();
                }
            };
            img.onerror = () => {
                alert(`画像の読み込みに失敗しました: ${src}\nファイル名と場所を確認してください。`);
            };
            img.src = src;
            loadedSprites[key] = img;
        }

        // ゲーム定数
        const moveSpeed = 8;
        const gameDuration = 60;
        const lukeWidth = 128;
        const lukeHeight = 128;
        const lureWidth = 96;
        const lureHeight = 96;
        const itemWidth = 32;
        const itemHeight = 32;

        let score = 0;
        let timer = gameDuration;
        let gameInterval;
        let timerInterval;
        let items = [];
        let isGameOver = false;

        const keysState = {
            'A': false, 'D': false,
            'ARROWLEFT': false, 'ARROWRIGHT': false
        };

        let luke;
        let lure;

        class Bear {
            constructor(x, y, name, image, width, height) {
                this.x = x;
                this.y = y;
                this.name = name;
                this.image = image;
                this.width = width;
                this.height = height;
            }
            draw() {
                ctx.drawImage(this.image, this.x, this.y, this.width, this.height);
            }
        }

        class Item {
            constructor(x, y, type, image) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.image = image;
                this.width = itemWidth;
                this.height = itemHeight;
                this.speed = Math.random() * 2 + 3; // 少しだけ落下速度をアップ
            }
            draw() {
                ctx.drawImage(this.image, this.x, this.y, this.width, this.height);
            }
            update() {
                this.y += this.speed;
            }
        }

        window.addEventListener('keydown', (e) => {
            const keyName = e.key.toUpperCase();
            if (keyName in keysState) {
                keysState[keyName] = true;
                if (['ARROWLEFT', 'ARROWRIGHT', 'A', 'D'].includes(keyName)) {
                    e.preventDefault();
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            const keyName = e.key.toUpperCase();
            if (keyName in keysState) {
                keysState[keyName] = false;
            }
        });

        function gameLoop() {
            if (isGameOver) return;
            update();
            draw();
        }

        function update() {
            if (keysState['A'] && luke.x > 0) luke.x -= moveSpeed;
            if (keysState['D'] && luke.x < canvas.width / 2 - luke.width) luke.x += moveSpeed;
            if (keysState['ARROWLEFT'] && lure.x > canvas.width / 2) lure.x -= moveSpeed;
            if (keysState['ARROWRIGHT'] && lure.x < canvas.width - lure.width) lure.x += moveSpeed;

            items.forEach((item, index) => {
                item.update();
                if (checkCollision(item, luke) && item.type === 'apple') {
                    score += 10;
                    items.splice(index, 1);
                } else if (checkCollision(item, lure) && item.type === 'present') {
                    score += 10;
                    items.splice(index, 1);
                } else if (checkCollision(item, luke) && item.type === 'present') {
                    score -= 5;
                    items.splice(index, 1);
                } else if (checkCollision(item, lure) && item.type === 'apple') {
                    score -= 5;
                    items.splice(index, 1);
                }
                if (item.y > canvas.height) {
                    items.splice(index, 1);
                }
            });

            scoreElement.innerText = score;
            if (Math.random() < 0.05) {
                generateItem();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (loadedSprites.bg) {
                ctx.drawImage(loadedSprites.bg, 0, 0, canvas.width, canvas.height);
            }

            if (luke) luke.draw();
            if (lure) lure.draw();

            items.forEach(item => item.draw());
        }

        function checkCollision(item, bear) {
            return (
                item.x < bear.x + bear.width &&
                item.x + item.width > bear.x &&
                item.y < bear.y + bear.height &&
                item.y + item.height > bear.y
            );
        }

        function generateItem() {
            const typeIndex = Math.random() < 0.5 ? 0 : 1;
            const itemKeys = ['apple', 'present'];
            const type = itemKeys[typeIndex];
            const image = loadedSprites[type];
            const x = Math.random() * (canvas.width - itemWidth);
            const y = -itemHeight;
            items.push(new Item(x, y, type, image));
        }

        function updateTimer() {
            timer--;
            timerElement.innerText = timer;
            if (timer <= 0) {
                endGame();
            }
        }

        function allImagesLoaded() {
            // ロード完了したらスタートボタンを表示
            loadingText.style.display = 'none';
            startBtn.style.display = 'block';
            
            const lukeX = 100;
            const lureX = canvas.width - 100 - lureWidth;
            const bearY = canvas.height - lukeHeight - 20; // 少し下に調整
            
            luke = new Bear(lukeX, bearY, 'ルーク', loadedSprites.luke, lukeWidth, lukeHeight);
            lure = new Bear(lureX, bearY + (lukeHeight - lureHeight), 'ルレ', loadedSprites.lure, lureWidth, lureHeight);
            
            draw(); // 開始前に背景とキャラを一度描画しておく
        }

        function startGame() {
            score = 0;
            timer = gameDuration;
            items = [];
            isGameOver = false;
            
            overlay.style.display = 'none';
            scoreElement.innerText = score;
            timerElement.innerText = timer;
            
            luke.x = 100;
            lure.x = canvas.width - 100 - lureWidth;
            
            // BGMの再生を開始（エラーが出てもゲームは止まらないようにする）
            bgm.currentTime = 0;
            bgm.play().catch(e => console.log("BGMの自動再生がブロックされました"));
            
            if (gameInterval) clearInterval(gameInterval);
            if (timerInterval) clearInterval(timerInterval);
            gameInterval = setInterval(gameLoop, 1000 / 60);
            timerInterval = setInterval(updateTimer, 1000);
        }

        function endGame() {
            isGameOver = true;
            if (gameInterval) clearInterval(gameInterval);
            if (timerInterval) clearInterval(timerInterval);
            
            // BGMを停止
            bgm.pause();
            
            // ゲームオーバー画面を表示
            overlay.style.display = 'flex';
            overlay.style.backgroundColor = 'rgba(255, 255, 255, 0.85)';
            overlayTitle.innerText = 'ゲームオーバー！';
            message.innerHTML = `最終スコア: <span style="font-size: 40px;">${score}</span> 点`;
            startBtn.style.display = 'none';
            resetBtn.style.display = 'block';
        }

        // ボタンのクリックイベント
        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', startGame);
    });
</script>

</body>
</html>
