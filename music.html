<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゆいなのへや — MUSIC</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .tracks {
        margin: 30px auto 0;
        width: min(100%, 760px);
        display: grid;
        gap: 14px;
      }
      .track {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 16px;
        align-items: center;
        padding: 18px 20px;
        transition: transform 0.25s ease, border-color 0.25s ease;
      }
      .track:hover { transform: translateX(6px); }
      .track .art {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        background: linear-gradient(135deg, rgba(255, 180, 84, 0.25), rgba(255, 127, 181, 0.25));
        border: 3px solid #fff;
      }
      .track h3 { margin: 0 0 2px; font-size: 1.05rem; font-weight: 900; }
      .track .artist { margin: 0 0 10px; color: var(--text-dim); font-size: 0.8rem; font-weight: 700; }
      .track audio { width: 100%; height: 36px; }
      .track .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
      .drop-note { margin: 30px auto 0; width: min(100%, 760px); }
      @media (max-width: 640px) {
        .track { grid-template-columns: 44px 1fr; padding: 14px; }
        .track .art { width: 44px; height: 44px; font-size: 1.2rem; }
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span class="blob"></span></div>
    <div class="floaties" aria-hidden="true">
      <span style="top: 15%; left: 5%">🎵</span>
      <span style="top: 30%; right: 6%">🎧</span>
      <span style="top: 70%; left: 8%">🎤</span>
      <span style="top: 80%; right: 10%">💖</span>
    </div>

    <header class="site-header">
      <a class="brand" href="index.html">🎀 ゆいなのへや</a>
      <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="comic.html">COMIC</a>
        <a href="game.html">GAME</a>
        <a href="movie.html">MOVIE</a>
        <a href="music.html" aria-current="page">MUSIC</a>
      </nav>
    </header>

    <main class="container">
      <section class="page-hero">
        <p class="eyebrow">Music</p>
        <h1><span class="gradient-text">ゆいなミュージック</span></h1>
        <p class="lead">SUNO AIでつくったオリジナルソングコレクション。ヘッドホンできくのがおすすめ🎧</p>
      </section>

      <section class="tracks" id="tracks"></section>

      <div class="add-bar">
        <button class="btn" id="add-track-btn" type="button">＋ きょくをついか</button>
      </div>

      <p class="notice drop-note reveal">
        「＋きょくをついか」でえらんだ曲は<strong>この端末だけ</strong>で再生できます（ブラウザに保存されます）。<br />
        みんなに公開したいときは、mp3を <code>assets/audio/</code> にアップロードして
        <code>assets/media.json</code> の <code>tracks</code> に1行追加してね。
      </p>
    </main>

    <footer class="site-footer">
      <p>© 2026 YUINA — Made with 💖</p>
      <p><a href="upload.html" style="color: #c9b8d6; font-size: 0.75rem; text-decoration: none;">🔧 こうしんページ</a></p>
    </footer>

    <script src="js/bgm.js"></script>
    <script src="js/reveal.js"></script>
    <script src="js/media-store.js"></script>
    <script>
      (() => {
        // media.json が読めないときの予備リスト
        const FALLBACK_TRACKS = [
          { file: "assets/audio/bgm.mp3", title: "ユイナへのメロディー V2.0", emoji: "🌸" },
          { file: "assets/audio/track2.mp3", title: "小さな勇者 V1.0", emoji: "⚔️" },
        ];
        const wrap = document.getElementById("tracks");

        function makeTrack({ title, emoji, src, isLocal, id, index }) {
          const el = document.createElement("article");
          el.className = "track glass";
          el.innerHTML = `
            <div class="art" aria-hidden="true">${emoji || "🎵"}</div>
            <div>
              <div class="head">
                <h3>${title}${isLocal ? '<span class="local-badge">この端末のみ</span>' : ""}</h3>
                ${isLocal ? '<button class="remove-btn" type="button">けす</button>' : ""}
              </div>
              <p class="artist">YUINA × SUNO AI${index ? ` — Track ${String(index).padStart(2, "0")}` : ""}</p>
              <audio controls preload="metadata"></audio>
            </div>`;
          const audio = el.querySelector("audio");
          audio.src = src;
          audio.addEventListener("play", () => {
            document.querySelectorAll("audio").forEach((a) => { if (a !== audio) a.pause(); });
            const btn = document.querySelector(".bgm-toggle");
            if (btn && btn.classList.contains("is-playing")) btn.click();
          });
          if (isLocal) {
            el.querySelector(".remove-btn").addEventListener("click", async () => {
              if (confirm(`「${title}」をけしてもいい？`)) {
                await MediaStore.remove(id);
                render();
              }
            });
          }
          return el;
        }

        async function render() {
          wrap.innerHTML = "";
          let tracks = FALLBACK_TRACKS;
          try {
            const res = await fetch("assets/media.json?t=" + Date.now(), { cache: "no-store" });
            if (res.ok) tracks = (await res.json()).tracks || FALLBACK_TRACKS;
          } catch {}
          tracks.forEach((t, i) => {
            wrap.appendChild(makeTrack({ title: t.title, emoji: t.emoji, src: t.file, index: i + 1 }));
          });
          try {
            const locals = await MediaStore.list("music");
            locals.forEach((item) => {
              wrap.appendChild(makeTrack({
                title: item.title,
                emoji: "🏠",
                src: URL.createObjectURL(item.blob),
                isLocal: true,
                id: item.id,
              }));
            });
          } catch {}
          wrap.querySelectorAll(".track").forEach((el, i) => {
            el.classList.add("reveal");
            setTimeout(() => el.classList.add("is-visible"), 100 * i);
          });
        }

        MediaStore.setupAddButton(document.getElementById("add-track-btn"), "music", "audio/*", render);
        render();
      })();
    </script>
  </body>
</html>
