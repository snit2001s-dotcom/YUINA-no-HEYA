<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゆいなのへや — COMIC</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .character-intro {
        margin: 10px auto 0;
        width: min(100%, 640px);
        padding: clamp(14px, 3vw, 24px);
        text-align: center;
      }
      .character-intro h2 { margin: 0 0 14px; font-size: 1.15rem; font-weight: 900; }
      .character-intro img {
        width: 100%;
        height: auto;
        border-radius: 14px;
        display: block;
      }
      .comic-viewer {
        margin: 30px auto 0;
        width: min(100%, 640px);
        padding: clamp(14px, 3vw, 24px);
        text-align: center;
      }
      .episode-title {
        margin: 0 0 14px;
        font-size: 1.15rem;
        font-weight: 900;
        color: #ff5f9e;
      }
      .comic-page {
        width: 100%;
        aspect-ratio: 2 / 3;
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        display: grid;
        place-items: center;
      }
      .comic-page img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .pager {
        margin-top: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
      }
      .pager .page-num { color: var(--text-dim); font-weight: 900; letter-spacing: 0.1em; }
      .episode-list {
        margin: 30px auto 0;
        width: min(100%, 640px);
        padding: 20px 24px;
      }
      .episode-list h2 { margin: 0 0 12px; font-size: 1.1rem; font-weight: 900; text-align: center; }
      .episode-list ol {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
      }
      .episode-list button {
        width: 100%;
        text-align: left;
        font-family: inherit;
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--text);
        background: #fff;
        border: 2px solid #ffe3ef;
        border-radius: 12px;
        padding: 10px 16px;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }
      .episode-list button:hover { transform: translateX(6px); border-color: #ff9ecb; background: #fff0f6; }
      .episode-list button.current { background: linear-gradient(135deg, #ffd6e8, #ffe9f3); border-color: #ff9ecb; }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span class="blob"></span></div>
    <div class="floaties" aria-hidden="true">
      <span style="top: 15%; left: 5%">📖</span>
      <span style="top: 30%; right: 6%">🌸</span>
      <span style="top: 70%; left: 8%">✏️</span>
      <span style="top: 80%; right: 10%">💖</span>
    </div>

    <header class="site-header">
      <a class="brand" href="index.html">🎀 ゆいなのへや</a>
      <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="comic.html" aria-current="page">COMIC</a>
        <a href="game.html">GAME</a>
        <a href="movie.html">MOVIE</a>
        <a href="music.html">MUSIC</a>
      </nav>
    </header>

    <main class="container">
      <section class="page-hero">
        <p class="eyebrow">Comic</p>
        <h1><span class="gradient-text">ゆいなコミック</span></h1>
        <p class="lead">ゆいなのまいにちをえがいたオリジナルコミック、全9話！ボタンや矢印キーでページをめくってね📖</p>
      </section>

      <!-- キャラクター紹介（assets/comic/characters.jpg があれば表示） -->
      <section class="character-intro glass reveal" id="character-intro" hidden>
        <h2>🌟 キャラクターしょうかい</h2>
        <img id="character-img" alt="ゆいなコミックのキャラクター紹介" />
      </section>

      <section class="comic-viewer glass reveal">
        <h2 class="episode-title" id="episode-title"></h2>
        <div class="comic-page" id="comic-page"></div>
        <div class="pager">
          <button class="btn ghost" id="prev-btn" type="button">← まえ</button>
          <span class="page-num"><span id="cur-page">1</span> / <span id="max-page">9</span></span>
          <button class="btn ghost" id="next-btn" type="button">つぎ →</button>
        </div>
      </section>

      <section class="episode-list glass reveal">
        <h2>📚 エピソードいちらん</h2>
        <ol id="episode-list"></ol>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 YUINA — Made with 💖</p>
      <p><a href="upload.html" style="color: #c9b8d6; font-size: 0.75rem; text-decoration: none;">🔧 こうしんページ</a></p>
    </footer>

    <script src="js/bgm.js"></script>
    <script src="js/reveal.js"></script>
    <script>
      (async () => {
        const FALLBACK_EPISODES = [
          { file: "assets/comic/page1.jpg", title: "第1話 テスト勉強編" },
          { file: "assets/comic/page2.jpg", title: "第2話 はよ寝なさい選手権" },
          { file: "assets/comic/page3.jpg", title: "第3話 プリン編" },
          { file: "assets/comic/page4.jpg", title: "第4話 くら寿司バトル編" },
          { file: "assets/comic/page5.jpg", title: "第5話 お小遣い交渉編" },
          { file: "assets/comic/page6.jpg", title: "第6話 テスト結果が返ってきた" },
          { file: "assets/comic/page7.jpg", title: "第7話 ずっと前からおったで" },
          { file: "assets/comic/page8.jpg", title: "第8話 なんか静かな日" },
          { file: "assets/comic/page9.jpg", title: "第9話（最終話）ちゃんとおるで" },
        ];

        // media.json から話リストとキャラ紹介画像を読み込み（無ければ予備リスト）
        let EPISODES = FALLBACK_EPISODES;
        let characterImage = "assets/comic/characters.jpg";
        try {
          const res = await fetch("assets/media.json");
          if (res.ok) {
            const m = await res.json();
            if (Array.isArray(m.comics) && m.comics.length) EPISODES = m.comics;
            if (m.characterImage) characterImage = m.characterImage;
          }
        } catch {}

        // キャラクター紹介画像があればセクションを表示
        const introImg = document.getElementById("character-img");
        introImg.addEventListener("load", () => {
          document.getElementById("character-intro").hidden = false;
        });
        introImg.src = characterImage;

        const pageEl = document.getElementById("comic-page");
        const titleEl = document.getElementById("episode-title");
        const curEl = document.getElementById("cur-page");
        const maxEl = document.getElementById("max-page");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const listEl = document.getElementById("episode-list");
        let page = 1;
        maxEl.textContent = EPISODES.length;

        // エピソード一覧
        EPISODES.forEach((ep, i) => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = ep.title;
          btn.addEventListener("click", () => {
            page = i + 1;
            render();
            document.querySelector(".comic-viewer").scrollIntoView({ behavior: "smooth" });
          });
          li.appendChild(btn);
          listEl.appendChild(li);
        });

        function render() {
          const ep = EPISODES[page - 1];
          curEl.textContent = page;
          titleEl.textContent = ep.title;
          prevBtn.disabled = page === 1;
          nextBtn.disabled = page === EPISODES.length;
          listEl.querySelectorAll("button").forEach((b, i) => {
            b.classList.toggle("current", i === page - 1);
          });

          const img = new Image();
          img.alt = ep.title;
          img.src = ep.file;
          img.onload = () => {
            pageEl.innerHTML = "";
            pageEl.appendChild(img);
          };
        }

        prevBtn.addEventListener("click", () => { if (page > 1) { page--; render(); } });
        nextBtn.addEventListener("click", () => { if (page < EPISODES.length) { page++; render(); } });
        window.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft" && !prevBtn.disabled) prevBtn.click();
          if (e.key === "ArrowRight" && !nextBtn.disabled) nextBtn.click();
        });

        render();
      })();
    </script>
  </body>
</html>
