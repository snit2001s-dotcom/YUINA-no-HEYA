<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゆいなのへや — MOVIE</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .videos {
        margin: 30px auto 0;
        width: min(100%, 860px);
        display: grid;
        gap: 20px;
      }
      .video-item {
        padding: clamp(12px, 2.5vw, 22px);
      }
      .video-item video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
        background: #000;
      }
      .video-item .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .video-item h2 { margin: 0; font-size: 1.1rem; font-weight: 900; color: #3f9cc9; }
      .drop-note { margin: 26px auto 0; width: min(100%, 860px); }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span class="blob"></span></div>
    <div class="floaties" aria-hidden="true">
      <span style="top: 15%; left: 5%">🎬</span>
      <span style="top: 30%; right: 6%">🍿</span>
      <span style="top: 70%; left: 8%">⭐</span>
      <span style="top: 80%; right: 10%">💖</span>
    </div>

    <header class="site-header">
      <a class="brand" href="index.html">🎀 ゆいなのへや</a>
      <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="comic.html">COMIC</a>
        <a href="game.html">GAME</a>
        <a href="movie.html" aria-current="page">MOVIE</a>
        <a href="music.html">MUSIC</a>
      </nav>
    </header>

    <main class="container">
      <section class="page-hero">
        <p class="eyebrow">Movie</p>
        <h1><span class="gradient-text">ゆいなシアター</span></h1>
        <p class="lead">えいぞうでたのしむ、もうひとつのゆいなのせかい🍿</p>
      </section>

      <section class="videos" id="videos"></section>

      <div class="add-bar">
        <button class="btn" id="add-video-btn" type="button">＋ どうがをついか</button>
      </div>

      <p class="notice drop-note reveal">
        「＋どうがをついか」でえらんだ動画は<strong>この端末だけ</strong>で再生できます（ブラウザに保存されます）。<br />
        みんなに公開したいときは、mp4を <code>assets/video/</code> にアップロードして
        <code>assets/media.json</code> の <code>videos</code> に1行追加してね。
      </p>
    </main>

    <footer class="site-footer">
      <p>© 2026 YUINA — Made with 💖</p>
      <p><a href="upload.html" style="color: #c9b8d6; font-size: 0.75rem; text-decoration: none;">🔧 こうしんページ</a></p>
    </footer>

    <script src="js/bgm.js"></script>
    <script src="js/reveal.js"></script>
    <script src="js/media-store.js"></script>
    <script>
      (() => {
        const FALLBACK_VIDEOS = [
          { file: "assets/video/movie.mp4", title: "ゆいなAIムービー", emoji: "🎬" },
        ];
        const wrap = document.getElementById("videos");

        function makeVideo({ title, emoji, src, isLocal, id }) {
          const el = document.createElement("article");
          el.className = "video-item glass";
          el.innerHTML = `
            <div class="head">
              <h2>${emoji || "🎬"} ${title}${isLocal ? '<span class="local-badge">この端末のみ</span>' : ""}</h2>
              ${isLocal ? '<button class="remove-btn" type="button">けす</button>' : ""}
            </div>
            <video controls preload="metadata" playsinline></video>`;
          const video = el.querySelector("video");
          video.src = src;
          // 動画をさいせいしたらサイトBGMと他の動画をとめる
          video.addEventListener("play", () => {
            document.querySelectorAll("video, audio").forEach((m) => { if (m !== video) m.pause(); });
            const btn = document.querySelector(".bgm-toggle");
            if (btn && btn.classList.contains("is-playing")) btn.click();
          });
          if (isLocal) {
            el.querySelector(".remove-btn").addEventListener("click", async () => {
              if (confirm(`「${title}」をけしてもいい？`)) {
                await MediaStore.remove(id);
                render();
              }
            });
          }
          return el;
        }

        async function render() {
          wrap.innerHTML = "";
          let videos = FALLBACK_VIDEOS;
          try {
            const res = await fetch("assets/media.json");
            if (res.ok) videos = (await res.json()).videos || FALLBACK_VIDEOS;
          } catch {}
          videos.forEach((v) => {
            wrap.appendChild(makeVideo({ title: v.title, emoji: v.emoji, src: v.file }));
          });
          try {
            const locals = await MediaStore.list("video");
            locals.forEach((item) => {
              wrap.appendChild(makeVideo({
                title: item.title,
                emoji: "🏠",
                src: URL.createObjectURL(item.blob),
                isLocal: true,
                id: item.id,
              }));
            });
          } catch {}
          wrap.querySelectorAll(".video-item").forEach((el, i) => {
            el.classList.add("reveal");
            setTimeout(() => el.classList.add("is-visible"), 100 * i);
          });
        }

        MediaStore.setupAddButton(document.getElementById("add-video-btn"), "video", "video/mp4,video/*", render);
        render();
      })();
    </script>
  </body>
</html>
